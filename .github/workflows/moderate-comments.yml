name: Moderate Comments

# Only comments are moderated. Discussions themselves are created by giscus
# (one per blog page) and GitHub can't minimize a Discussion anyway — restrict
# who can start discussions via the category settings instead.
on:
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read
  discussions: write # hide comments
  issues: write # append to the "Moderation log" issue

concurrency:
  group: moderate-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Moderate comment
        uses: actions/github-script@v7
        env:
          # Optional: extra banned words, newline- or comma-separated.
          # Add a repository secret named BANNED_WORDS to use it.
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
        with:
          script: |
            const moderate = require(`${process.env.GITHUB_WORKSPACE}/scripts/moderate.js`);
            await moderate({ github, context, core });
